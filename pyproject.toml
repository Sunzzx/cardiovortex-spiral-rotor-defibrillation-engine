[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardiovortex"
version = "0.1.0"
description = "Cardiac electrophysiology spiral-rotor and LEAP defibrillation simulation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["cardiovortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
